<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>База техкарт и меню</title>
  <!-- Подключаем библиотеку Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; color: #333; padding: 15px; max-width: 800px; margin: 0 auto; }
    
    h1, h2 { text-align: center; margin-bottom: 15px; color: #2c3e50; }
    
    /* Секция поиска и фильтров */
    .search-box { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    .search-input { width: 100%; padding: 12px 15px; font-size: 16px; border: 2px solid #e0e0e0; border-radius: 8px; margin-bottom: 12px; outline: none; transition: border 0.2s; }
    .search-input:focus { border-color: #3498db; }
    
    .tags-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .tag-btn { border: none; padding: 6px 12px; border-radius: 20px; background: #eef2f5; color: #555; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.2s; }
    .tag-btn.active { background: #3498db; color: white; }

    /* Панель смены */
    .shift-panel { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #e0e0e0; }
    .btn-shift { width: 100%; background: #3498db; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn-shift.active { background: #e74c3c; }
    
    /* Контейнер для списка блюд с прокруткой */
    .cards-scroll-container {
      max-height: 480px;
      overflow-y: auto;
      padding-right: 6px;
      margin-bottom: 25px;
    }
    
    .cards-scroll-container::-webkit-scrollbar { width: 6px; }
    .cards-scroll-container::-webkit-scrollbar-track { background: #eef2f5; border-radius: 4px; }
    .cards-scroll-container::-webkit-scrollbar-thumb { background: #bdc3c7; border-radius: 4px; }

    /* Список блюд */
    .cards-list { display: grid; gap: 15px; }
    .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 10px; position: relative; border: 2px solid transparent; transition: all 0.3s; }
    
    /* Статусы смены для тега Остаток */
    .card.shift-uncheck { border-color: #e74c3c !important; background-color: #fff5f5; }
    .card.shift-checked { border-color: #2ecc71 !important; background-color: #f6fff7; }

    .card-header { border-bottom: 1px solid #eee; padding-bottom: 8px; padding-right: 75px; min-height: 38px; }
    .card-title { font-size: 18px; font-weight: bold; color: #2c3e50; }
    .card-price { font-size: 15px; font-weight: bold; color: #27ae60; margin-top: 2px; }
    .card-calories { font-size: 13px; color: #7f8c8d; margin-top: 1px; }

    .card-tags { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
    .card-tag { background: #eef2f5; color: #666; font-size: 12px; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
    
    .card-body { display: flex; gap: 15px; }
    .card-img { width: 90px; height: 90px; object-fit: cover; border-radius: 8px; background: #eee; flex-shrink: 0; }
    .card-content { flex-grow: 1; font-size: 14px; line-height: 1.4; white-space: pre-line; color: #444; }
    
    .card-actions { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 5px; width: 75px; }
    .btn-edit { background: #3498db; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px; text-align: center; }
    .btn-delete { background: #ff4d4d; color: white; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; font-size: 12px; text-align: center; }
    
    .btn-check-item { background: #e74c3c; color: white; border: none; border-radius: 4px; padding: 5px 6px; cursor: pointer; font-size: 11px; font-weight: bold; text-align: center; margin-top: 2px; }
    .btn-check-item.checked { background: #2ecc71; }

    /* Форма добавления/редактирования */
    .admin-section { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 25px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 5px; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .form-group textarea { height: 80px; resize: vertical; }
    
    .checkbox-tags { display: flex; flex-wrap: wrap; gap: 10px; }
    .checkbox-tags label { font-weight: normal; font-size: 14px; cursor: pointer; }
    
    .btn-submit { width: 100%; background: #2ecc71; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    .btn-submit:hover { background: #27ae60; }
    .btn-cancel { width: 100%; background: #95a5a6; color: white; border: none; padding: 8px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 5px; display: none; }
    
    .status-badge { text-align: center; font-size: 12px; color: #27ae60; margin-bottom: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Техкарты и Состав</h1>
  <div class="status-badge" id="statusBadge">☁️ Подключено к облачной базе</div>

  <!-- Блок Поиска -->
  <div class="search-box">
    <input type="text" id="searchInput" class="search-input" placeholder="Поиск по названию...">
    <div class="tags-filter" id="tagsFilter"></div>
    <div class="shift-panel" id="shiftPanel">
      <button class="btn-shift" id="btnShiftToggle">📋 Начать проверку смены</button>
    </div>
  </div>

  <!-- Окно списка блюд -->
  <div class="cards-scroll-container">
    <div class="cards-list" id="cardsContainer"></div>
  </div>

  <!-- Форма Редактора -->
  <div class="admin-section" id="adminSection">
    <h2 id="formTitle">Добавить позицию</h2>
    <form id="addForm">
      <input type="hidden" id="editItemId" value="">
      
      <div class="form-group">
        <label for="itemName">Название:</label>
        <input type="text" id="itemName" required placeholder="Например: Капучино 300мл или Стаканчик средний">
      </div>

      <div class="form-group">
        <label for="itemPrice">Цена:</label>
        <input type="text" id="itemPrice" placeholder="Например: 190₽">
      </div>

      <div class="form-group">
        <label for="itemCalories">Калорийность:</label>
        <input type="text" id="itemCalories" placeholder="Например: 140 ккал">
      </div>
      
      <div class="form-group">
        <label>Теги:</label>
        <div class="checkbox-tags" id="tagCheckboxes"></div>
      </div>

      <div class="form-group">
        <label for="itemImg">Ссылка на картинку (URL):</label>
        <input type="url" id="itemImg" placeholder="https://example.com/image.jpg">
      </div>

      <div class="form-group">
        <label for="itemRecipe">Состав / Техническая карта / Остаток:</label>
        <textarea id="itemRecipe" required placeholder="Эспрессо: 30 мл&#10;Молоко: 220 мл&#10;или Остаток: 45 шт"></textarea>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">Сохранить позицию</button>
      <button type="button" class="btn-cancel" id="btnCancel" onclick="resetForm()">Отмена редактирования</button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://pigciguqbzeiyaanougn.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpZ2NpZ3VxYnplaXlhYW5vdWduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2NjY5NDQsImV4cCI6MjEwMTI0Mjk0NH0.iKDW6c6f286G48oCcRyCuQmqdoEmw6PZvk73uAwSf9U';

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const AVAILABLE_TAGS = ["Кофе", "Напиток без кофеина", "Горячее", "Холодное", "Диетическое", "Аллергенное", "Соевое", "Смена", "Остаток"];
    let items = [];
    let selectedTag = null;
    let isShiftMode = false;
    let checkedShiftIds = new Set(); // Хранит только проверенные позиции

    const cardsContainer = document.getElementById('cardsContainer');
    const searchInput = document.getElementById('searchInput');
    const tagsFilterContainer = document.getElementById('tagsFilter');
    const tagCheckboxesContainer = document.getElementById('tagCheckboxes');
    const shiftPanel = document.getElementById('shiftPanel');
    const btnShiftToggle = document.getElementById('btnShiftToggle');
    const addForm = document.getElementById('addForm');

    function initTags() {
      tagsFilterContainer.innerHTML = '';
      AVAILABLE_TAGS.forEach(tag => {
        const btn = document.createElement('button');
        btn.className = 'tag-btn';
        btn.textContent = tag;
        btn.onclick = () => toggleTagFilter(tag, btn);
        tagsFilterContainer.appendChild(btn);
      });

      tagCheckboxesContainer.innerHTML = '';
      AVAILABLE_TAGS.forEach(tag => {
        const label = document.createElement('label');
        label.innerHTML = `<input type="checkbox" value="${tag}"> ${tag}`;
        tagCheckboxesContainer.appendChild(label);
      });
    }

    function toggleTagFilter(tag, btnElement) {
      if (selectedTag === tag) {
        selectedTag = null;
        btnElement.classList.remove('active');
        shiftPanel.style.display = 'none';
        isShiftMode = false;
        checkedShiftIds.clear();
        btnShiftToggle.classList.remove('active');
        btnShiftToggle.textContent = '📋 Начать проверку смены';
      } else {
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        selectedTag = tag;
        btnElement.classList.add('active');

        if (tag === "Остаток") {
          shiftPanel.style.display = 'block';
        } else {
          shiftPanel.style.display = 'none';
          isShiftMode = false;
          checkedShiftIds.clear();
          btnShiftToggle.classList.remove('active');
          btnShiftToggle.textContent = '📋 Начать проверку смены';
        }
      }
      renderCards();
    }

    // Включение / запуск проверки смены
    btnShiftToggle.addEventListener('click', () => {
      isShiftMode = !isShiftMode;
      if (isShiftMode) {
        checkedShiftIds.clear(); // СБРАСЫВАЕМ ВСЕ: при старте все карточки снова КРАСНЫЕ
        btnShiftToggle.classList.add('active');
        btnShiftToggle.textContent = '❌ Завершить проверку смены';
      } else {
        checkedShiftIds.clear();
        btnShiftToggle.classList.remove('active');
        btnShiftToggle.textContent = '📋 Начать проверку смены';
      }
      renderCards();
    });

    async function fetchItems() {
      cardsContainer.innerHTML = '<p style="text-align:center; color:#888;">Загрузка данных...</p>';
      const { data, error } = await db.from('recipes').select('*').order('id', { ascending: false });
      if (error) {
        console.error('Ошибка загрузки:', error);
        cardsContainer.innerHTML = '<p style="text-align:center; color:red;">Ошибка подключения к базе данных</p>';
      } else {
        items = data || [];
        renderCards();
      }
    }

    function renderCards() {
      const query = searchInput.value.toLowerCase().trim();
      cardsContainer.innerHTML = '';

      const filteredItems = items.filter(item => {
        const matchesSearch = item.title.toLowerCase().includes(query) || 
                              item.recipe.toLowerCase().includes(query) ||
                              (item.price && item.price.toLowerCase().includes(query)) ||
                              (item.calories && item.calories.toLowerCase().includes(query));
        const matchesTag = selectedTag ? item.tags.includes(selectedTag) : true;
        return matchesSearch && matchesTag;
      });

      if (filteredItems.length === 0) {
        cardsContainer.innerHTML = '<p style="text-align:center; color:#888;">Ничего не найдено</p>';
        return;
      }

      filteredItems.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        
        // В режиме смены логика строгая: если проверено -> зелёный, если нет -> красный
        if (isShiftMode && item.tags.includes("Остаток")) {
          if (checkedShiftIds.has(item.id)) {
            card.classList.add('shift-checked');
          } else {
            card.classList.add('shift-uncheck');
          }
        }

        const defaultImg = 'https://via.placeholder.com/150?text=No+Image';

        const isItemChecked = checkedShiftIds.has(item.id);

        card.innerHTML = `
          <div class="card-actions">
            <button class="btn-delete" onclick="deleteItem(${item.id})">Удалить</button>
            <button class="btn-edit" onclick="editItem(${item.id})">Edit</button>
            ${isShiftMode && item.tags.includes("Остаток") ? 
              `<button class="btn-check-item ${isItemChecked ? 'checked' : ''}" onclick="toggleCheckShift(${item.id})">
                ${isItemChecked ? '✓ Проверено' : 'Чекнуть'}
               </button>` : ''}
          </div>
          <div class="card-header">
            <div class="card-title">${escapeHtml(item.title)}</div>
            ${item.price ? `<div class="card-price">${escapeHtml(item.price)}</div>` : ''}
            ${item.calories ? `<div class="card-calories">🔥 ${escapeHtml(item.calories)}</div>` : ''}
          </div>
          <div class="card-tags">
            <strong>Теги:</strong> 
            ${item.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
          </div>
          <div class="card-body">
            <img src="${item.img || defaultImg}" alt="${escapeHtml(item.title)}" class="card-img" onerror="this.src='${defaultImg}'">
            <div class="card-content">
              <strong>ТК / Состав / Остаток:</strong><br>${escapeHtml(item.recipe)}
            </div>
          </div>
        `;
        cardsContainer.appendChild(card);
      });
    }

    // Переключение конкретного остатка (красный <-> зеленый)
    window.toggleCheckShift = function(id) {
      if (checkedShiftIds.has(id)) {
        checkedShiftIds.delete(id);
      } else {
        checkedShiftIds.add(id);
      }
      renderCards();
    };

    window.editItem = function(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;

      document.getElementById('editItemId').value = item.id;
      document.getElementById('itemName').value = item.title;
      document.getElementById('itemPrice').value = item.price || '';
      document.getElementById('itemCalories').value = item.calories || '';
      document.getElementById('itemImg').value = item.img || '';
      document.getElementById('itemRecipe').value = item.recipe;

      const checkboxes = tagCheckboxesContainer.querySelectorAll('input');
      checkboxes.forEach(cb => {
        cb.checked = item.tags.includes(cb.value);
      });

      document.getElementById('formTitle').textContent = 'Редактировать позицию';
      document.getElementById('btnSubmit').textContent = 'Сохранить изменения';
      document.getElementById('btnCancel').style.display = 'block';

      document.getElementById('adminSection').scrollIntoView({ behavior: 'smooth' });
    };

    function resetForm() {
      addForm.reset();
      document.getElementById('editItemId').value = '';
      document.getElementById('formTitle').textContent = 'Добавить позицию';
      document.getElementById('btnSubmit').textContent = 'Сохранить позицию';
      document.getElementById('btnCancel').style.display = 'none';
    }

    addForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const editId = document.getElementById('editItemId').value;
      const title = document.getElementById('itemName').value;
      const price = document.getElementById('itemPrice').value;
      const calories = document.getElementById('itemCalories').value;
      const img = document.getElementById('itemImg').value;
      const recipe = document.getElementById('itemRecipe').value;
      const checkedTags = Array.from(tagCheckboxesContainer.querySelectorAll('input:checked')).map(cb => cb.value);

      const payload = {
        id: editId ? Number(editId) : Date.now(),
        title,
        price,
        calories,
        tags: checkedTags,
        img,
        recipe
      };

      const { error } = await db.from('recipes').upsert(payload);
      if (error) {
        alert('Ошибка при сохранении: ' + error.message);
      } else {
        // Если меняем позицию во время смены, отмечаем её зеленым
        if (editId && isShiftMode) {
          checkedShiftIds.add(Number(editId));
        }
        await fetchItems();
        resetForm();
      }
    });

    window.deleteItem = async function(id) {
      if (confirm("Удалить эту позицию?")) {
        const { error } = await db.from('recipes').delete().eq('id', id);
        if (error) {
          alert('Ошибка при удалении: ' + error.message);
        } else {
          checkedShiftIds.delete(id);
          await fetchItems();
        }
      }
    };

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    searchInput.addEventListener('input', renderCards);
    initTags();
    fetchItems();
  </script>
</body>
</html>
